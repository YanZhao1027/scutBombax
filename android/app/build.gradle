apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

/*
 * Release signing is deliberately optional, and deliberately outside this repository.
 *
 * AGENTS.md says never commit secrets, and a signing key is the one secret whose loss is not
 * recoverable: an APK signed with key A can never be updated in place by key B. So the key and
 * its password live wherever the user keeps them, and the build reads them from
 * `android/keystore.properties` (gitignored) or from BOMBAX_KEYSTORE_* environment variables,
 * which win so a one-off build can pass them without writing anything to disk.
 *
 * Without them `assembleRelease` still produces a correctly built, **unsigned** APK named
 * `app-release-unsigned.apk` — and says so out loud, because an unsigned release is otherwise
 * easy to mistake for a finished one until it refuses to install.
 */
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def signingValue = { String envName, String propName ->
    System.getenv(envName) ?: keystoreProps.getProperty(propName)
}

def releaseKeystorePath = signingValue('BOMBAX_KEYSTORE_FILE', 'storeFile')
def releaseStorePassword = signingValue('BOMBAX_KEYSTORE_STORE_PASSWORD', 'storePassword')
def releaseKeyAlias = signingValue('BOMBAX_KEYSTORE_KEY_ALIAS', 'keyAlias')
def releaseKeyPassword = signingValue('BOMBAX_KEYSTORE_KEY_PASSWORD', 'keyPassword')
def releaseSigningReady = [
    releaseKeystorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword
].every { it && !it.trim().isEmpty() }

// A relative storeFile is resolved against android/, so the path in keystore.properties can stay
// machine-neutral ("bombax.jks" next to the properties file).
def releaseKeystoreFile = releaseKeystorePath ? rootProject.file(releaseKeystorePath) : null

android {
    namespace = "cn.scut.bombax"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "cn.scut.bombax"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "0.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile releaseKeystoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                // minSdk 24 means v2 alone would do, but v1 costs nothing and keeps the APK
                // installable on an older machine that only checks the JAR signature.
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        debug {
            // Debug builds stay installable over adb without Android Studio.
            applicationIdSuffix ""
            minifyEnabled false
        }
        release {
            // R8 stays off on purpose. Capacitor invokes @PluginMethod reflectively, so enabling
            // minification without verified keep rules is how a release build loses the bridge
            // while every unit test still passes. Revisit with a device run, not without one.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }
    testOptions {
        unitTests.returnDefaultValues = false
    }
}

// Configuration-time, so it has to be gated on what was actually asked for: printing this on
// every debug build and every test run would train everyone to ignore it.
def releaseRequested = gradle.startParameter.taskNames.any {
    it.contains('assembleRelease') || it.contains('bundleRelease') || it == 'build'
}
if (!releaseSigningReady && releaseRequested) {
    // Name what is missing. "No key found" while the key *is* configured but a password line was
    // left blank sends people to the wrong file — that exact mistake happened on 2026-10-08.
    def missing = [
        storeFile    : releaseKeystorePath,
        storePassword: releaseStorePassword,
        keyAlias     : releaseKeyAlias,
        keyPassword  : releaseKeyPassword
    ].findAll { _, value -> !value || value.trim().isEmpty() }.keySet()
    logger.warn(
        "scutBombax: release signing is incomplete, missing [${missing.join(', ')}] — assembleRelease " +
            "will produce an UNSIGNED apk (app-release-unsigned.apk), which will not install. Fill " +
            "them in android/keystore.properties (gitignored; see android/keystore.properties.example) " +
            "or export BOMBAX_KEYSTORE_FILE / _STORE_PASSWORD / _KEY_ALIAS / _KEY_PASSWORD."
    )
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Every SCUT request is sent from Kotlin, never from the WebView.
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    testImplementation "junit:junit:$junitVersion"
    // Real org.json on the JVM so the pure parsers can be unit tested.
    testImplementation 'org.json:json:20250517'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
