worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    sendfile on;
    client_max_body_size 4m;
    client_body_timeout 20s;
    keepalive_timeout 18s;
    limit_req_zone $binary_remote_addr zone=campus_auth:10m rate=18r/s;
    limit_conn_zone $binary_remote_addr zone=campus_connections:10m;
    server {
        listen 110.64.88.48:8443 ssl;
        http2 on;
        server_name activity-lan.10273055.xyz;
        ssl_certificate /certs/live/bombax-activity-lan/fullchain.pem;
        ssl_certificate_key /certs/live/bombax-activity-lan/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_timeout 5m;
        ssl_session_tickets off;
        ssl_prefer_server_ciphers off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        # Keep this endpoint campus-only, even though DNS is public.
        # 127.0.0.1 and this machine's wired IP are retained for local testing.
        allow 127.0.0.1/32;
        allow 110.64.88.48/32;
        allow 10.195.0.0/16;
        allow 10.196.0.0/16;
        allow 10.197.0.0/16;
        deny all;
        limit_req zone=campus_auth burst=40 nodelay;
        limit_conn campus_connections 30;
        if ($host != "activity-lan.10273055.xyz") { return 421; }
        location / {
            proxy_pass http://127.0.0.1:8790;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header CF-Connecting-IP $remote_addr;
            proxy_set_header X-Bombax-Relay-Auth "";
            proxy_set_header X-Bombax-Client-IP "";
            proxy_set_header Connection "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 35s;
        }
    }
}
