<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101014" media="(prefers-color-scheme: dark)" />
    <!--
      Defense in depth for the project rule "the WebView never talks to SCUT":
      only same-origin assets and data: captcha images are allowed, and
      connect-src keeps fetch()/XHR inside the local app origin.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="description" content="华南理工大学宿舍电费、水费与空调费余额查询。" />
    <title>宿舍水电</title>
  </head>
  <body>
    <header>
      <span id="session-pill" data-state="off">未登录</span>
    </header>

    <main>
      <section id="results-panel" hidden>
        <p class="room"><strong id="room-name">宿舍</strong><span id="user-name"></span></p>

        <figure class="electric" aria-live="polite">
          <figcaption>电费余额<span id="electric-unit">平台返回余额 · 元</span></figcaption>
          <p id="electric-value">—</p>
        </figure>

        <p class="secondary" aria-live="polite">
          <span>水费 <strong id="water-value">—</strong><span id="water-unit"></span></span>
          <span id="ac-row" hidden>空调 <strong id="ac-value">—</strong><span id="ac-unit"></span></span>
        </p>

        <p class="meta">
          <button id="query-button" type="button">刷新</button>
          <span>更新 <span id="updated-at">等待查询</span></span>
          <span id="query-state"></span>
        </p>

        <p id="history-note" class="history-note" role="status" aria-live="polite" hidden></p>

        <p class="notice-line">
          <label><input id="notice-toggle" type="checkbox" />常驻通知</label>
          <span class="hint">把最近一次结果贴在通知栏；查询仍只发生在前台</span>
        </p>

        <p class="notice-line">
          <label><input id="daily-toggle" type="checkbox" disabled />晚间余额快照</label>
          <span class="hint">每天约 23:00 记一次余额，供离线查看与用量统计。<span id="daily-due">未开启</span></span>
        </p>

        <p class="segmented" id="refresh-choices" role="radiogroup" aria-label="自动刷新">
          <label><input type="radio" name="refresh" value="0" checked />关</label>
          <label><input type="radio" name="refresh" value="5" />5′</label>
          <label><input type="radio" name="refresh" value="10" />10′</label>
          <label><input type="radio" name="refresh" value="30" />30′</label>
          <span class="hint">仅前台</span>
        </p>

        <p id="results-status" class="status" role="status" aria-live="polite"></p>
        <p class="meta"><button id="logout-button" type="button" class="quiet">退出</button></p>
      </section>

      <section id="login-panel">
        <form id="login-form" novalidate>
          <p class="pair">
            <select id="campus" autocomplete="off" aria-label="所在校区">
              <option value="GZIC">GZIC · 广州国际校区</option>
              <option value="DXC">DXC · 大学城校区</option>
            </select>
            <select id="login-type" autocomplete="off" aria-label="登录方式">
              <option value="sno" selected>学工号登录</option>
              <option value="card">账号登录</option>
            </select>
          </p>

          <input
            id="username"
            type="text"
            inputmode="text"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            maxlength="100"
            placeholder="学号 / 一卡通账号"
            aria-label="学号或一卡通账号"
            required
          />
          <input
            id="password"
            type="password"
            inputmode="text"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            maxlength="99"
            placeholder="一卡通查询密码（字母 + 数字，不少于 8 位）"
            aria-label="一卡通查询密码"
            required
          />

          <p class="captcha">
            <button
              id="captcha-image"
              type="button"
              aria-label="验证码图片，点击换一张"
            ><span class="captcha-placeholder">加载中…</span></button>
            <input
              id="captcha-code"
              type="text"
              inputmode="text"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
              maxlength="32"
              placeholder="验证码"
              aria-label="验证码"
            />
            <button id="captcha-refresh" type="button" class="quiet">换一张</button>
          </p>

          <button id="login-button" type="submit">登录并查询</button>
          <p id="login-status" class="status" role="status" aria-live="polite"></p>
          <p class="hint">密码仅用于本次登录，不写入任何存储；所有校园请求由 Android 原生代码发出。</p>
        </form>
      </section>

      <details id="diagnostics-panel">
        <summary>会话与诊断</summary>
        <p id="session-state">会话：未登录</p>
        <p class="diag-actions">
          <button id="health-btn" type="button" class="quiet">健康检查</button>
          <button id="refresh-token-btn" type="button" class="quiet">测试 refresh_token</button>
          <button id="clear-btn" type="button" class="quiet danger">清除登录状态</button>
        </p>
        <p class="hint">
          学校会下发 refresh_token，但实测不接受 <code>grant_type=refresh_token</code>；
          官方网页客户端也从不刷新。令牌有效期 70 天，到期重新登录。
        </p>
        <pre id="native-log" aria-live="polite"></pre>
      </details>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
