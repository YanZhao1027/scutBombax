name: Hua Gong Mu Mian 2.0 Beta Android

on:
  push:
    branches:
      - release/2.0.0-beta
  pull_request:
    paths:
      - 'src/**'
      - 'android/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'capacitor.config.ts'
      - '.github/workflows/android-2-beta.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-beta:
    name: Material 3 Beta APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify preinstalled Android SDK
        run: |
          test -n "$ANDROID_HOME"
          command -v sdkmanager
          sdkmanager --version
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android API and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Enforce Beta metadata before publishing any APK
        run: |
          node -e "const p=require('./package.json');if(p.version!=='2.0.0-beta.1')process.exit(1)"
          grep -q 'applicationId "cn.scut.bombax.beta"' android/app/build.gradle
          grep -q 'versionName "2.0.0-beta.1"' android/app/build.gradle
      - run: pnpm install --frozen-lockfile
      - name: Verify source and business logic
        run: |
          pnpm check:privacy
          pnpm check:dom
          pnpm test
      - run: pnpm build
      - run: pnpm exec cap sync android
      - name: Kotlin tests and installable Android debug APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HuaGongMuMian-2.0.0-beta.1-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
