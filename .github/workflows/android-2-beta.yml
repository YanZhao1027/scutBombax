name: Hua Gong Mu Mian 2.0 Beta Android

on:
  push:
    branches:
      - release/2.0.0-beta
  pull_request:
    paths:
      - 'src/**'
      - 'android/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'capacitor.config.ts'
      - '.github/workflows/android-2-beta.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-beta:
    name: Material 3 Beta APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The action's default "tools" package was retired by Google.
          # Explicit packages avoid sdkmanager "tools" failing on hosted runners.
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android API and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Enforce Beta metadata before publishing any APK
        run: |
          node -e "const p=require('./package.json');if(p.version!=='2.0.0-beta.3')process.exit(1)"
          grep -q 'applicationId "cn.scut.bombax.beta"' android/app/build.gradle
          grep -q 'versionName "2.0.0-beta.3"' android/app/build.gradle
          grep -q 'versionCode 2000003' android/app/build.gradle
      - run: pnpm install --frozen-lockfile
      - name: Verify source and business logic
        run: |
          pnpm check:privacy
          pnpm check:dom
          pnpm test
      - run: pnpm build
      - name: Assert bundled web entry excludes retired activity-stage
        run: |
          if grep -R -F -e 'activity-stage.10273055.xyz' -e 'activity-demo.10273055.xyz' dist/; then
            echo "::error::Deprecated staging/demo activity URL found in web bundle"
            exit 1
          fi
          grep -R -F -q 'https://activity.10273055.xyz/' dist/
      - run: pnpm exec cap sync android
      - name: Kotlin tests and installable Android debug APK
        working-directory: android
        run: ./gradlew --no-daemon --no-watch-fs testDebugUnitTest assembleDebug
      - name: Assert built APK contains only approved activity entry
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          if unzip -p "$APK" 'classes*.dex' | strings | grep -F -q -e 'activity-stage.10273055.xyz' -e 'activity-demo.10273055.xyz'; then
            echo "::error::Deprecated staging/demo URL found in compiled native Android code"
            exit 1
          fi
          if unzip -p "$APK" 'assets/public/assets/*.js' | grep -F -q -e 'activity-stage.10273055.xyz' -e 'activity-demo.10273055.xyz'; then
            echo "::error::Deprecated activity URL found in packaged JavaScript"
            exit 1
          fi
          unzip -p "$APK" assets/public/index.html | grep -q 'id="activity-open"'
      - uses: actions/upload-artifact@v4
        with:
          name: HuaGongMuMian-2.0.0-beta.3-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
