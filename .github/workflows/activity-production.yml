name: Activity Production Integration Checks
on:
  push:
    branches:
      - feat/activity-production-ai-review
  pull_request:
    paths:
      - 'activity-quickcheck/**'
      - '.github/workflows/activity-production.yml'
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: activity-quickcheck/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: activity-quickcheck
      - run: |
          node --check deepseek-review.mjs
          node --check cloudflare-live/worker.mjs
          node --check cloudflare-live/scripts/provision-organizer.mjs
          node --check cloudflare-live/public/app.js
          node --check public/app.js
          npm test
        working-directory: activity-quickcheck
      - name: Prepare self-hosted camera scanner
        working-directory: activity-quickcheck
        run: node scripts/stage-live-assets.mjs
      - name: Bundle Worker without deploying
        working-directory: activity-quickcheck
        run: npx --yes wrangler@4.131.1 deploy --config wrangler.live.build.jsonc --dry-run --outdir /tmp/activity-cf-bundle
      - run: node scripts/check-privacy.mjs
